<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1d19" />
      <stop offset="100%" stop-color="#0f0e0c" />
    </linearGradient>
    
    <!-- Gold Logo Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6421" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#b88a2d" />
    </linearGradient>
    
    <!-- Accent Sage Gradient -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f8a78" />
      <stop offset="100%" stop-color="#3c5c4e" />
    </linearGradient>
  </defs>

  <!-- Smooth Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.25" />

  <!-- Geometric Abstract Design: Book & Pillar / Scale Elements -->
  <g transform="translate(256, 256)">
    <!-- Right leaf / Shield -->
    <path d="M 0,-120 C 60,-120 110,-70 110,0 C 110,80 50,130 0,140 C -50,130 -110,80 -110,0 C -110,-70 -60,-120 0,-120 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Center Pillar -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Scale Beam -->
    <path d="M -70,-20 Q 0,-45 70,-20" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    
    <!-- Scale Pans -->
    <circle cx="-70" cy="15" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
    <circle cx="70" cy="15" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
    
    <!-- Connections -->
    <line x1="-70" y1="-20" x2="-70" y2="1" stroke="url(#goldGrad)" stroke-width="4" />
    <line x1="70" y1="-20" x2="70" y2="1" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Base -->
    <path d="M -40,95 L 40,95" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
