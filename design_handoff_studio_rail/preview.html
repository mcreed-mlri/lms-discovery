<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LACE — Studio + Collapsible Rail (A2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #e9ebef; font-family: 'Geist', system-ui, sans-serif; }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }
  .label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #565c69; margin: 36px 0 12px; }
  .frame { border: 1px solid #d8dbe1; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 8px 30px rgba(20,22,27,.08); }
  .frame *::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx?v=1"></script>
<script type="text/babel" src="dir-studio.jsx?v=1"></script>
<script type="text/babel" src="dir-studio2.jsx?v=1"></script>
<script type="text/babel">
  function Preview() {
    return (
      <div className="wrap">
        <div className="label">A2 · Home — rail expanded (click “Collapse” in the rail footer to toggle live)</div>
        <div className="frame"><StudioRailHome /></div>
        <div className="label">A2 · Home — rail collapsed (icon strip)</div>
        <div className="frame"><StudioRailHomeCollapsed /></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Preview />);
</script>
</body>
</html>
