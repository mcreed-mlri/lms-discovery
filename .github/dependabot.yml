version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Security patches matter here; routine version churn does not. Next 16.2.9
    # shipped with 9 high-severity advisories and nothing surfaced them until
    # someone happened to run `npm audit` by hand.
    groups:
      # One PR for all dev tooling — lint, test, build. Low risk, high volume.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      # Runtime patches grouped too, but kept separate so they get real review.
      runtime-patches:
        dependency-type: production
        update-types: ["patch"]
      # react and react-dom must be the exact same version — react-dom checks
      # this at runtime, not just as a type constraint. PRs #59 and #60
      # (2026-09-21) bumped them to 19.3.0 in two separate PRs, and each one's
      # CI failed alone with "Incompatible React versions". Their @types
      # packages ride along for the same reason. Majors for react/react-dom
      # are still raised separately, via the ignore list below.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
    # Majors for the framework, React, the linter, the compiler, the CSS
    # engine, and the runtime type definitions are deliberate migrations, not
    # dependency bumps — raise them as their own piece of work.
    #
    # eslint is here because of a concrete failure: Dependabot proposed
    # eslint 10.8.0 and CI failed. eslint-config-next declares its peer range as
    # ">=9.0.0", which *permits* a major it has not been validated against, so
    # npm installs it happily and the config then breaks at runtime. The peer
    # range cannot be relied on to gate this; the ignore rule can.
    #
    # typescript and tailwindcss were added the same way, after PRs #19 and #18
    # failed on 2026-08-24:
    #   · typescript 7.0.2 — `tsc --noEmit` passes, then `eslint .` dies on
    #     import with "typescript-eslint does not support TS 7.0"
    #     (typescript-eslint#10940). A toolchain gap, not our code.
    #   · tailwindcss 4.3.3 — v4 is a rewrite. The build fails at
    #     app/globals.css because the PostCSS plugin moved to
    #     @tailwindcss/postcss, and the v3 `content` + `theme.extend` config
    #     would have to become CSS-first `@theme`. That regenerates the locked
    #     colour tokens, so it needs a full axe sweep (ADR 0008), not a bump.
    #
    # @types/node is different from the rest, and worse. The others fail loudly:
    # CI goes red and the PR cannot merge. This one fails silently. The types
    # must track the pinned runtime major — Node 24 in .nvmrc — because types
    # describing Node 26 let tsc accept calls to APIs that do not exist at
    # runtime. Types do not affect existing code, only new code written against
    # them, so every check passes green and the mistake surfaces later, in
    # production, in whatever was written next. Dependabot proposed 26.2.0 in
    # PR #17 (declined in "Move to TypeScript 6.0.3 and align @types/node with
    # the pinned runtime") and 26.4.0 again in #29. Without this rule it will
    # keep proposing, and the green checkmark will keep arguing for it.
    #
    # When the runtime moves to Node 26, raise @types/node in the same change
    # as .nvmrc and engines, and drop this rule for that cycle.
    #
    # vitest and @vitest/coverage-v8 joined the list after PRs #33 and #34
    # (2026-09-14): Dependabot proposed each as its own major-bump PR, but
    # @vitest/coverage-v8's peer range pins the exact vitest version it ships
    # against (peer vitest@"4.1.11" from @vitest/coverage-v8@4.1.11), so
    # bumping either one alone makes `npm ci` fail with ERESOLVE — neither PR
    # can merge on its own, and the dev-tooling group doesn't help because it
    # only bundles minor/patch updates, not majors. If vitest 5 is worth
    # taking, bump both together by hand in one change.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
