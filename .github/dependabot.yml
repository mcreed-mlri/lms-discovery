version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Security patches matter here; routine version churn does not. Next 16.2.9
    # shipped with 9 high-severity advisories and nothing surfaced them until
    # someone happened to run `npm audit` by hand.
    groups:
      # One PR for all dev tooling — lint, test, build. Low risk, high volume.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      # Runtime patches grouped too, but kept separate so they get real review.
      runtime-patches:
        dependency-type: production
        update-types: ["patch"]
    # Majors for the framework, React, and the linter are deliberate migrations,
    # not dependency bumps — raise them as their own piece of work.
    #
    # eslint is here because of a concrete failure: Dependabot proposed
    # eslint 10.8.0 and CI failed. eslint-config-next declares its peer range as
    # ">=9.0.0", which *permits* a major it has not been validated against, so
    # npm installs it happily and the config then breaks at runtime. The peer
    # range cannot be relied on to gate this; the ignore rule can.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
