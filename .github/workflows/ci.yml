# Continuous integration: quality checks on every push and pull request.
# Deployment is NOT handled here — Vercel's GitHub integration deploys
# automatically when main is updated.
#
# Also runs weekly on Mondays (after Dependabot's Monday npm PRs) so main
# still gets validated when nothing merged, and on demand via workflow_dispatch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 14:00 UTC ≈ 10:00 ET — same day as Dependabot npm updates.
    - cron: "0 14 * * 1"
  workflow_dispatch:

# A new push to the same branch supersedes the old run. Without this, rapid
# pushes queue up redundant jobs and the useful result waits behind stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  # Next 16.2.9 sat in this repo with 9 high-severity advisories, including a
  # proxy bypass, until someone ran this by hand. High and critical fail the
  # build; anything lower is Dependabot's job, not a blocker.
  #
  # This is a separate job rather than a step in `checks` because advisories are
  # published against versions already in the lockfile — the failure arrives
  # without anyone pushing code. As a leading step it took the rest of the job
  # down with it: the 2026-08-17 nanoid advisory (GHSA-2v37-7h3g-55p8) skipped
  # typecheck, lint, format, tests, and build across three runs, so nothing was
  # known about the code itself. Split out, a fresh advisory and a real type
  # error are two independent red marks instead of one.
  #
  # No `npm ci` here on purpose: `npm audit` resolves the tree from
  # package-lock.json alone, so installing would add ~40s and change nothing.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies
        run: npm audit --audit-level=high

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Separate job so a browser download and a 130-page production build do not
  # slow down the fast feedback above, and so an e2e flake is distinguishable at
  # a glance from a type error.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Covers the critical user paths AND runs axe against every route in both
      # themes. The accessibility work in this app is deliberate and detailed;
      # this stage is what stops a palette or layout change from quietly undoing
      # it. Playwright starts its own production server (see playwright.config.ts).
      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
