name: GitHub Pages not used for Learning Hub

on:
  workflow_dispatch:

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Explain hosting decision
        run: |
          echo "Learning Hub uses Next.js API routes for Brightspace OAuth, Supabase, and admin sync."
          echo "GitHub Pages only supports static hosting, so this app should deploy to Vercel or another server-capable host."
          echo "Keep GitHub Pages for the static wiki and documentation."
